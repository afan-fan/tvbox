# TVBox 多仓探活（每天北京时间 04:00 自动跑）
name: check

on:
  schedule:
    - cron: "0 20 * * *"   # UTC 20:00 == 北京时间 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe sources
        run: python tools/check.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh live sources $(date -u +%Y-%m-%d)"
            git push
          fi
